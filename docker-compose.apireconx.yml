services:
  apireconx:
    build:
      context: .
      dockerfile: Dockerfile.apireconx
    ports:
      - "8000:8000"
    volumes:
      - apireconx-data:/app/data
  demo-target:
    build:
      context: .
      dockerfile: Dockerfile.apireconx
    command: ["python", "-m", "uvicorn", "apireconx.demo_target:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

volumes:
  apireconx-data:
